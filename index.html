<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo-180.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0B0B0B" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RxFx Logbook Admin</title>

    <!-- ── Performance: network hints (cut TTFB by 100-200ms) ───── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  </head>
  <body style="background-color: #0B0B0B; color: #f5f5f5; margin: 0; min-height: 100vh;">
    <div id="root"></div>
    <div id="root-error" style="display:none; padding:20px; color:#fff; font-family:monospace; background:#0B0B0B; min-height:100vh;"></div>
    <script type="module">
      // 🔒 SECURITY: use textContent instead of innerHTML to prevent XSS
      // via error messages originating from external sources.
      window.addEventListener('error', (e) => {
        const el = document.getElementById('root-error');
        if (el) {
          el.style.display = 'block';
          const h2 = document.createElement('h2');
          h2.textContent = 'Global Error';
          const pre = document.createElement('pre');
          pre.textContent = e.message || String(e);
          el.appendChild(h2);
          el.appendChild(pre);
          el.appendChild(document.createElement('hr'));
        }
      });
      window.addEventListener('unhandledrejection', (e) => {
        const el = document.getElementById('root-error');
        if (el) {
          el.style.display = 'block';
          const h2 = document.createElement('h2');
          h2.textContent = 'Unhandled Rejection';
          const pre = document.createElement('pre');
          pre.textContent = e.reason?.stack || e.reason || String(e);
          el.appendChild(h2);
          el.appendChild(pre);
          el.appendChild(document.createElement('hr'));
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
